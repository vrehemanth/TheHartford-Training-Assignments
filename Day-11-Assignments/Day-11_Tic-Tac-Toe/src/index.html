<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div class="turn-container">
        <h3>Current Turn</h3>
        <div class="turn-row">
            <div class="turn-box active">X</div>
            <div class="turn-box">O</div>
        </div>
    </div>
    <br><br>
    <div class="main-grid">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <h2 id="results"></h2>
    <button id="play-again">Play Again</button>
    <button id="reset-game">Reset Game</button>

    <script src="script.js"></script>
</body>
</html>
