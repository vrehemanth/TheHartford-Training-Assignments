<!DOCTYPE html>
<html lang="en">
<head>
    <title>Insurance Dashboard</title>
    <style>
        .highlight {
            background-color: #e0f2fe;
        }

        .active {
            color: green;
            font-weight: bold;
        }
    </style>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <h1 id="pageTitle">Insurance Customer Dashboard</h1>

    <h2>Customers</h2>
    <ul id="customerList">
        <li class="customer">Ravi – Health</li>
        <li class="customer">Anita – Vehicle</li>
        <li class="customer">Karan – Life</li>
    </ul>

    <h2>Policies</h2>
    <p class="policy">Health Insurance</p>
    <p class="policy">Vehicle Insurance</p>
    <p class="policy">Life Insurance</p>

    <form id="enquiryForm">
        <input type="text" name="customerName" placeholder="CustomerName" />
        <input type="email" name="email" placeholder="Email" />
        <button id="submit" name="button" type="submit">Submit</button>
    </form>

    <img src="../assets/image.png" height="200" width="350 "/>
    <img src="../assets/policies.jpeg" height="200" width="350"/>

    <a href="#">View Policy</a>
