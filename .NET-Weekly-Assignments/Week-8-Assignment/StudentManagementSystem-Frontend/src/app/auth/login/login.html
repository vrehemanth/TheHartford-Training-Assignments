<div
  class="min-h-screen bg-slate-50 flex items-center justify-center p-6 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-opacity-50">

  <div class="relative w-full max-w-lg">

    <!-- Header -->
    <div class="text-center mb-8 animate-fade-in">
      <div
        class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600 shadow-lg shadow-indigo-500/30 mb-6">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4">
          </path>
        </svg>
      </div>
      <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">Welcome <span class="text-gradient">Back</span>
      </h1>
      <p class="text-slate-500 text-sm mt-2 font-medium">Log in to your account to continue</p>
    </div>

    <!-- Card -->
    <div
      class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 p-8 sm:p-10 animate-scale-in">

      <div *ngIf="error"
        class="bg-red-50 text-red-600 px-4 py-3 rounded-xl text-sm font-medium border border-red-100 mb-6">
        {{ error }}
      </div>

      <form (ngSubmit)="login()" class="space-y-6">

        <div class="space-y-1.5">
          <label class="label">Email Address</label>
          <input type="email" [(ngModel)]="loginForm.email" name="email" required
            class="input-modern bg-slate-50 hover:bg-slate-100 transition-colors" placeholder="name@company.com">
        </div>

        <div class="space-y-1.5">
          <label class="label">Password</label>
          <input type="password" [(ngModel)]="loginForm.password" name="password" required
            class="input-modern bg-slate-50 hover:bg-slate-100 transition-colors" placeholder="••••••••">
        </div>

        <!-- ✅ CAPTCHA SECTION -->
        <div class="space-y-1.5 pt-2">
          <label class="label">Security Verification</label>

          <div class="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-xl px-5 py-3 mb-3">
            <span class="text-xl font-bold text-slate-800 tracking-wider">
              {{ captchaQuestion }}
            </span>

            <button type="button" (click)="generateCaptcha()"
              class="text-sm font-bold text-slate-500 hover:text-indigo-600 transition-colors">
              Refresh
            </button>
          </div>

          <input type="text" [(ngModel)]="userCaptcha" name="captcha" required
            class="input-modern bg-slate-50 hover:bg-slate-100 transition-colors text-center font-bold text-lg"
            placeholder="Answer">
        </div>

        <div class="flex items-center justify-between text-sm pt-2">
          <label class="flex items-center gap-2 text-slate-600 font-medium cursor-pointer">
            <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-600">
            Remember me
          </label>

          <a routerLink="/forgot-password" class="text-indigo-600 hover:text-indigo-800 font-bold transition-colors">
            Forgot password?
          </a>
        </div>

        <button
          class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition-all transform hover:-translate-y-0.5 mt-4">
          <span *ngIf="!loading">Sign In to Dashboard</span>
          <span *ngIf="loading" class="flex items-center justify-center gap-2">
            <svg class="animate-spin h-5 w-5 text-white" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none">
              </circle>
              <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
              </path>
            </svg>
            Signing in...
          </span>
        </button>

      </form>

    </div>

    <p class="text-center text-sm text-slate-500 font-medium mt-8 mb-8">
      Don't have an account yet?
      <a routerLink="/register" class="text-indigo-600 hover:text-indigo-800 font-bold transition-colors ml-1">Create
        one now</a>
    </p>

  </div>
</div>
