<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 via-white to-blue-50 px-4">

  <div class="w-full max-w-md glass-card space-y-5">

    <h2 class="text-2xl font-bold text-slate-800 text-center">
      Account Recovery
    </h2>

    <div *ngIf="message" class="bg-green-50 text-green-700 px-4 py-2 rounded-xl text-sm">
      {{ message }}
    </div>

    <div *ngIf="error" class="error-box">
      {{ error }}
    </div>

    <!-- STEP 1: Email -->
    <form (ngSubmit)="getQuestion()" class="space-y-4" *ngIf="step === 1">

      <p class="text-sm text-slate-500 text-center mb-4">
        Enter your registered email to get your security question.
      </p>

      <div>
        <label class="label">Email</label>
        <input type="email" [(ngModel)]="email" name="email" required class="input-modern"
          placeholder="you@example.com">
      </div>

      <button class="btn-primary w-full">
        Next
      </button>

    </form>


    <!-- STEP 2: Answer & Reset -->
    <form (ngSubmit)="resetPassword()" class="space-y-4" *ngIf="step === 2">

      <p class="text-sm text-slate-500 text-center mb-4">
        Answer your security question to reset your password.
      </p>

      <div>
        <label class="label text-indigo-700 font-semibold">{{ securityQuestion }}</label>
        <input type="text" [(ngModel)]="securityAnswer" name="securityAnswer" required class="input-modern mt-1"
          placeholder="Your answer">
      </div>

      <div>
        <label class="label">New Password</label>
        <input type="password" [(ngModel)]="newPassword" name="newPassword" required class="input-modern"
          placeholder="••••••••">
      </div>

      <button type="submit" class="btn-primary w-full">
        Reset Password
      </button>

    </form>

    <p class="text-center text-sm">
      <a routerLink="/login" class="text-indigo-600 hover:text-indigo-700">
        Back to Login
      </a>
    </p>

  </div>
</div>
