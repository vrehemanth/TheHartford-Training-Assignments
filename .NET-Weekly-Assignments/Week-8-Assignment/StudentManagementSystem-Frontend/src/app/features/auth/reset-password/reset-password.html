<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 via-white to-blue-50 px-4">

    <div class="w-full max-w-md glass-card space-y-5">

        <h2 class="text-2xl font-bold text-slate-800 text-center">
            Create New Password
        </h2>

        <p class="text-sm text-slate-500 text-center">
            Enter your new password below.
        </p>

        <div *ngIf="message" class="bg-green-50 text-green-700 px-4 py-2 rounded-xl text-sm">
            {{ message }}
            <div class="mt-2">
                <a routerLink="/login" class="underline font-semibold">Go to Login</a>
            </div>
        </div>

        <div *ngIf="error" class="error-box">
            {{ error }}
        </div>

        <form (ngSubmit)="submit()" class="space-y-4" *ngIf="!message">

            <div>
                <label class="label">New Password</label>
                <input type="password" [(ngModel)]="newPassword" name="newPassword" required class="input-modern"
                    placeholder="••••••••">
            </div>

            <div>
                <label class="label">Confirm Password</label>
                <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required
                    class="input-modern" placeholder="••••••••">
            </div>

            <button type="submit" class="btn-primary w-full">
                Reset Password
            </button>

        </form>

        <p class="text-center text-sm" *ngIf="!message">
            <a routerLink="/login" class="text-indigo-600 hover:text-indigo-700">
                Back to Login
            </a>
        </p>

    </div>
</div>
