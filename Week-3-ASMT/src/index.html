<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Online Banking Operations Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="header">
  <img src="../assets/image.png" alt="Bank Logo" class="logo">
  <h1> Online Banking Dashboard</h1>
</div><br><br>

<div class="controls">
  <input type="text" id="search" placeholder="Search by name">
  <select id="branchFilter">
    <option value="">All Branches</option>
  </select>
  <button onclick="sortByBalance()">Sort by Balance</button>
</div>

<div class="dashboard">
  <div class="accounts" id="accounts"></div>

  <div class="sidebar">
    <h2>Summary</h2>
    <div class="total" id="totalBalance"></div><br><br>
    <div class="controls">
        <input id="name" placeholder="Name">
        <input id="email" placeholder="Email">
        <input id="branch" placeholder="Branch">
        <button onclick="createAccount()">Create Account</button>
    </div>
  </div>
</div>

<div id="historyModal" class="modal hidden">
  <div class="modal-content">
    <span class="close" onclick="closeHistory()">×</span>
    <h2>Transaction History</h2>
    <div id="modalHistory"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
