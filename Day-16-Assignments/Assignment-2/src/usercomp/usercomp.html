<div class="min-h-screen bg-gray-100 p-8">

  <!-- TITLE -->
  <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">
    My Basic CRUD Operations
  </h2>

  <!-- FORM CARD -->
  <div
    class="max-w-md mx-auto bg-white shadow-lg rounded-xl p-6 border border-gray-200">
    <h3 class="text-xl font-semibold text-gray-700 mb-5 text-center">
      {{ isEditMode ? 'Update User' : 'Add New User' }}
    </h3>

    <div class="space-y-4">
      <!-- NAME -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">
          Name
        </label>
        <input
          type="text"
          [(ngModel)]="user.name"
          placeholder="Enter name"
          class="w-full px-4 py-2 rounded-md border border-gray-300
                 text-gray-800 placeholder-gray-400
                 focus:ring-2 focus:ring-gray-400 focus:outline-none"/>
      </div>

      <!-- EMAIL -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">
          Email
        </label>
        <input
          type="email"
          [(ngModel)]="user.email"
          placeholder="Enter email"
          class="w-full px-4 py-2 rounded-md border border-gray-300
                 text-gray-800 placeholder-gray-400
                 focus:ring-2 focus:ring-gray-400 focus:outline-none"/>
      </div>

      <!-- BUTTON -->
      <button
        (click)="saveUser()"
        class="w-full py-2 rounded-md font-semibold
               bg-gray-800 text-white
               hover:bg-gray-900 transition">
        {{ isEditMode ? 'Update User' : 'Add User' }}
      </button>
    </div>
  </div>

  <!-- TABLE -->
  <div class="max-w-4xl mx-auto mt-10 bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
    <table class="w-full text-left">
      <thead class="bg-gray-200 text-gray-700">
        <tr>
          <th class="px-6 py-3">Name</th>
          <th class="px-6 py-3">Email</th>
          <th class="px-6 py-3 text-center">Actions</th>
        </tr>
      </thead>

      <tbody>
        @for (u of users; track $index) {
        <tr class="border-b hover:bg-gray-50 transition">
          <td class="px-6 py-3 font-medium text-gray-800">
            {{ u.name }}
          </td>
          <td class="px-6 py-3 text-gray-700">
            {{ u.email }}
          </td>
          <td class="px-6 py-3 text-center space-x-2">
            <button (click)="editUser(u)"
              class="px-4 py-1 rounded-md text-sm
                     bg-gray-600 text-white
                     hover:bg-gray-700 transition">
              Edit
            </button>
            <button (click)="deleteUser(u.id)"
              class="px-4 py-1 rounded-md text-sm
                     bg-gray-500 text-white
                     hover:bg-gray-600 transition">
              Delete
            </button>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>

</div>
