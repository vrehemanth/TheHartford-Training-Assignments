<div class="max-w-xl mx-auto mt-10 p-6 bg-white rounded-xl shadow-md text-center">
  <h1 class="text-2xl font-bold text-gray-800 mb-4">
     Angular Custom Pipes Demo
  </h1>
  <p class="text-gray-600 mb-2">
    <span class="font-semibold">Original Text:</span>
    <span class="text-blue-600">{{ title }}</span>
  </p>
  <div class="mt-4 space-y-3">
    <h2 class="text-lg">
      <span class="font-semibold text-gray-700">Kebab Case:</span>
      <span class="text-green-600">
        {{ title | kebabCase }}
      </span>
    </h2>

    <h2 class="text-lg">
      <span class="font-semibold text-gray-700">Reversed Text:</span>
      <span class="text-purple-600">
        {{ title | reversePipe }}
      </span>
    </h2>
  </div>
</div>
