<!-- Built-in Pipes Demo -->
<main class="max-w-2xl mx-auto mt-10 p-6 bg-white rounded-xl shadow-lg space-y-6">
  <!-- Header -->
  <header>
    <h1 class="text-2xl font-bold text-gray-800 text-center">
      Built-in Pipes Demo
    </h1>
  </header>

  <!-- Purchase Info -->
  <section class="bg-gray-50 p-4 rounded-lg space-y-2">
    <h2 class="text-lg text-gray-700">
      Purchases from
      <span class="font-semibold text-blue-600">
        {{ company | titlecase }}
      </span>
    </h2>

    <p class="text-gray-700">
      Date:
      <span class="font-medium text-indigo-600">
        {{ purchasedOn | date | uppercase }}
      </span>
    </p>

    <p class="text-gray-700">
      Total Amount:
      <span class="font-medium text-green-600">
        {{ amount | currency }}
      </span>
    </p>
  </section>
  <section class="bg-gray-50 p-4 rounded-lg space-y-2">
    <h2 class="text-gray-700">
      Customer Name:
      <span class="font-semibold text-purple-600">
        {{ (firstName + ' ' + lastName) | uppercase }}
      </span>
    </h2>

    <p class="text-gray-700">
      Access Status:
      <span class="font-semibold" [ngClass]="isAdmin ? 'text-green-600' : 'text-red-600'">
        {{ isAdmin ? 'Granted' : 'Denied' | uppercase }}
      </span>
    </p>
  </section>
</main>
