<!DOCTYPE html>
<html>
<head>
    <title>Insurance Policy Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Insurance Policy Manager</h1>

    <!-- ADD POLICY FORM -->
    <div class="form-card">

        <input id="customerName" placeholder="Customer Name">
        <select id="policyType">
            <option value="Health">Health</option>
            <option value="Life">Life</option>
            <option value="Vehicle">Vehicle</option>
        </select>
        <input id="premiumAmount" type="number" placeholder="Premium Amount">
        <input id="Duration" type="number" placeholder="Duration (Years)">
        <input id="startDate" type="date">

        <select id="active">
            <option value="true">Active</option>
            <option value="false">Inactive</option>
        </select>

        <div class="buttons">
            <button class="add" onclick="addPolicy()">POST</button>
        </div>
    </div>

    <h2>All Policies</h2>
    <div id="policies"></div>
</div>

<!-- UPDATE POPUP -->
<div id="editModal" class="modal">
    <div class="modal-box">
        <h2>Edit Policy</h2>

        <input type="hidden" id="editId">

        <input id="editCustomer" placeholder="Customer Name">
        <select id="editPolicyType">
            <option value="Health">Health</option>
            <option value="Life">Life</option>
            <option value="Vehicle">Vehicle</option>
        </select>
        <input id="editPremium" type="number" placeholder="Premium Amount">
        <input id="editDuration" type="number" placeholder="Duration (Years)">
        <input id="editDate" type="date">
        <select id="editActive">
            <option value="true">Active</option>
            <option value="false">Inactive</option>
        </select>

        <div class="modal-actions">
            <button class="update" onclick="saveUpdate()">Update</button>
            <button class="cancel" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
