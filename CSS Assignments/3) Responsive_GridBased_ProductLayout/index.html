<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product List Grid Layout</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="layout">

    <section class="products">
      <h1>Desserts</h1>

      <div class="grid">

        <div class="card">
          <div class="img-box">
            <img src="./images/image-waffle-desktop.jpg">
            <button class="cart-btn">🛒 Add to Cart</button>
          </div>
          <p class="category">Waffle</p>
          <h2>Waffle with Berries</h2>
          <p class="price">$6.50</p>
        </div>

        <div class="card">
          <div class="img-box">
            <img src="./images/vanilla.jpg">
            <button class="cart-btn">🛒 Add to Cart</button>
          </div>
          <p class="category">Crème Brûlée</p>
          <h2>Vanilla Bean Crème Brûlée</h2>
          <p class="price">$7.00</p>
        </div>

        <div class="card">
          <div class="img-box">
            <img src="./images/macron.jpg">
            <button class="cart-btn">🛒 Add to Cart</button>
          </div>
          <p class="category">Macaron</p>
          <h2>Macaron Mix of Five</h2>
          <p class="price">$8.00</p>
        </div>

        <div class="card">
          <div class="img-box">
            <img src="./images/tiramisu.jpg">
            <button class="cart-btn">🛒 Add to Cart</button>
          </div>
          <p class="category">Cake</p>
          <h2>Tiramisu Slice</h2>
          <p class="price">$5.50</p>
        </div>

        <div class="card">
          <div class="img-box">
            <img src="./images/baklava.jpg">
            <button class="cart-btn">🛒 Add to Cart</button>
          </div>
          <p class="category">Baklava</p>
          <h2>Pistachio Baklava</h2>
          <p class="price">$4.00</p>
        </div>

        <div class="card">
          <div class="img-box">
            <img src="./images/lemon.jpg">
            <button class="cart-btn">🛒 Add to Cart</button>
          </div>
          <p class="category">Pie</p>
          <h2>Lemon Meringue Pie</h2>
          <p class="price">$5.00</p>
        </div>

      </div>
    </section>

    
    <aside class="cart-box">
      <h2 align="left"><b>Your Cart (0)</b></h2>
      <img src="./images/cart.png">
      <p class="empty-text">Your added item will appear here</p>
    </aside>

  </main>

</body>
</html>
