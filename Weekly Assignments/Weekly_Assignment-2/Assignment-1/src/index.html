<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="insurance">
        <h2>Insurance Enquiry & Feedback</h2>
        <p>Submit your policy related queries or feedback below</p>

        <form id="form">

            <div class="fields">
                <label>Full Name</label>
                <input type="text" id="name">
                <div class="error" id="nameError"></div>
            </div>

            <div class="fields">
                <label>Email</label>
                <input type="email" id="email">
                <div class="error" id="emailError"></div>
            </div>

            <div class="fields">
                <label>Mobile Number</label>
                <input type="tel" id="mobile">
                <div class="error" id="mobileError"></div>
            </div>

            <div class="fields">
                <label>Request Type</label>
                <select id="requestType">
                    <option value="">-- Select --</option>
                    <option>Policy Enquiry</option>
                    <option>Claim Related</option>
                    <option>Feedback</option>
                </select>
                <div class="error" id="requestError"></div>
            </div>

            <div class="fields">
                <label>Policy Type</label>
                <select id="policyType">
                    <option value="">-- Select --</option>
                    <option>Health Insurance</option>
                    <option>Life Insurance</option>
                    <option>Vehicle Insurance</option>
                    <option>Home Insurance</option>
                </select>
                <div class="error" id="policyError"></div>
            </div>

            <div class="fields">
                <label>Message</label>
                <textarea id="message"></textarea>
                <div class="error" id="messageError"></div>
            </div>

            <div class="fields-radio">
                <label>Experience Rating</label>
                <div class="radio-group">
                    <label><input type="radio" name="rating" value="1"><span>1</span></label>
                    <label><input type="radio" name="rating" value="2"><span>2</span></label>
                    <label><input type="radio" name="rating" value="3"><span>3</span></label>
                    <label><input type="radio" name="rating" value="4"><span>4</span></label>
                    <label><input type="radio" name="rating" value="5"><span>5</span></label>
                </div>
                <div class="error" id="ratingError"></div>
            </div>

            <button type="submit">Submit</button>

            <div class="success" id="successMsg"></div>

        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
