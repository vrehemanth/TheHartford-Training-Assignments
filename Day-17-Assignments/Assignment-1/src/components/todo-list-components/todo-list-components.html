<div class="min-h-screen bg-slate-50 p-6">

  <!-- Title -->
  <h2 class="text-3xl font-bold text-slate-800 mb-6 tracking-wide text-center">
    User CRUD Operations Application
  </h2>

  <!-- CREATE / UPDATE FORM -->
  <div class="max-w-4xl mx-auto mb-10 bg-white border border-slate-200 rounded-xl shadow-sm p-6">
    <h3 class="text-lg font-semibold text-slate-700 mb-4">
      {{ userForm.id ? 'Update User' : 'Add New User' }}
    </h3>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <input class="border border-slate-300 rounded px-3 py-2 text-slate-700"
        placeholder="Name"
        [(ngModel)]="userForm.name"/>

      <input class="border border-slate-300 rounded px-3 py-2 text-slate-700"
        placeholder="Email"
        [(ngModel)]="userForm.email"/>

      <input class="border border-slate-300 rounded px-3 py-2 text-slate-700"
        placeholder="Age"
        [(ngModel)]="userForm.age"/>

      <input class="border border-slate-300 rounded px-3 py-2 text-slate-700"
        placeholder="City"
        [(ngModel)]="userForm.city"/>

    </div>

    <div class="flex gap-3 mt-5">
      <button (click)="saveUser()"
        class="px-5 py-2 bg-slate-800 text-white rounded hover:bg-slate-700">
        {{ userForm.id ? 'Update' : 'Add' }}
      </button>

      <button
        (click)="resetForm()"
        class="px-5 py-2 bg-slate-300 text-slate-800 rounded hover:bg-slate-400">
          Clear
      </button>
    </div>
  </div>

  <!-- TABLE -->
  <div class="overflow-hidden rounded-xl shadow-md bg-white border border-slate-200 max-w-6xl mx-auto">
    <table class="w-full border-collapse">

      <!-- Header -->
      <thead class="bg-slate-100 border-b border-slate-200">
        <tr>
          <th class="px-6 py-4 text-left text-sm font-semibold text-slate-700 uppercase">ID</th>
          <th class="px-6 py-4 text-left text-sm font-semibold text-slate-700 uppercase">Name</th>
          <th class="px-6 py-4 text-left text-sm font-semibold text-slate-700 uppercase">Email</th>
          <th class="px-6 py-4 text-left text-sm font-semibold text-slate-700 uppercase">Age</th>
          <th class="px-6 py-4 text-left text-sm font-semibold text-slate-700 uppercase">City</th>
          <th class="px-6 py-4 text-center text-sm font-semibold text-slate-700 uppercase">Actions</th>
        </tr>
      </thead>

      <!-- Body -->
      <tbody class="divide-y divide-slate-200">
        @for(user of users; track user.id) {
          <tr class="hover:bg-slate-100 transition-colors duration-150">

            <td class="px-6 py-4 font-semibold text-slate-800">
              {{ user.id }}
            </td>

            <td class="px-6 py-4 text-slate-800 font-medium">
              {{ user.name }}
            </td>

            <td class="px-6 py-4 text-slate-600">
              {{ user.email }}
            </td>

            <td class="px-6 py-4">
              <span class="inline-flex px-3 py-1 rounded-full bg-slate-200 text-slate-700 text-sm font-semibold">
                {{ user.age }} yrs
              </span>
            </td>

            <td class="px-6 py-4 text-slate-700">
              <span class="inline-block px-3 py-1 rounded-lg bg-slate-200 text-slate-700 text-sm font-medium">
                {{ user.city }}
              </span>
            </td>

            <!-- ACTIONS -->
            <td class="px-6 py-4 text-center">
              <button (click)="editUser(user)"
                class="px-3 py-1 text-sm bg-slate-700 text-white rounded hover:bg-slate-600 mr-2">
                Edit
              </button>
              <button (click)="deleteUser(user.id)"
                class="px-3 py-1 text-sm bg-red-600 text-white rounded hover:bg-red-500">
                Delete
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
